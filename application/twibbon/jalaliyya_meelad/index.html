  <title>Jalaliyya Meelad Fest 2026</title>
  <link rel="stylesheet" href="https://googleapis.com">
  <style>
    :root { --navy: #640203; --light-bg: #f0f2f5; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    body { background: var(--light-bg); display: flex; justify-content: center; min-height: 100vh; }
    
    .container { width: 100%; max-width: 450px; background: white; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

    .header-container{ width:100%; background-image: linear-gradient(#640203, #4f0103); display:  flex; justify-content :  center; padding:  30px 0px 0px 0px; border-radius:  0% 0% 10% 10%;}

    /* Top Side: Image Header */
    .header-img { width: 100%; display: block;  }

    /* Center Part: Frame Area */
    .canvas-area { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
    .canvas-wrapper { border-radius: 20px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.1); line-height: 0; }
    #twibbonCanvas { background: #eee; cursor: grab; max-width: 100%; height: auto; touch-action: none; }

  
#userPhoto { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none;}


    /* Controls: Buttons and Slider */
    .controls { padding: 10px 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .action-row { display: flex; gap: 15px; align-items: center; }
    
    .icon-btn { 
      width: 60px; height: 60px; background: var(--navy); border: none; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; position: relative; overflow: hidden;
    }
    .icon-btn svg { width: 30px; height: 30px; fill: white; }
    
    .slider-container { width: 90%; }
    #scaleSlider { width: 100%; accent-color: var(--navy); height: 6px; cursor: pointer; }

    /* Download Footer */
.footer-action { 
      padding: 20px; 
      display: flex; 
      gap: 15px; /* Space between buttons */
    }
    
    .download-btn, .share-btn {
      flex: 1; /* Makes both buttons take up equal half of the space */
      color: white; padding: 15px 5px; border: none;
      border-radius: 8px; font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; cursor: pointer;
    }
    
    .download-btn { background: var(--navy); }
    .share-btn { background: var(--navy); } /* WhatsApp Green for sharing */
    
    .download-btn:disabled, .share-btn:disabled { opacity: 0.5; cursor: not-allowed; }


    .scroll-controls { position: fixed; bottom: 30px; right: 20px; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1px 1px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); gap: 0px;}
    .scroll-controls i { font-size: 25px; color: var(--navy); cursor: pointer; transition: transform 0.2s; }
    .scroll-controls i:active {transform: scale(0.8); /* Creates a satisfying "click" animation */}
    .scroll-controls span { font-size: 10px; font-weight: 800; color: #555; letter-spacing: 1px; }

    /*Footer*/
         .footer{ margin-top: 15px; padding-top: 12px; border-top: 1px solid #eee; display: flex; align-items: center; gap: 12px; font-size: 12px; color: #555; justify-content: center; } 
         .footer-img{ width: 50px; height: 50px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 2px solid var(--primary); } 
         .footer-img img{ width: 100%; height: 100%; object-fit: cover; } 
         .footer-text a{ color: var(--primary); text-decoration: none; font-weight: 600; } 
         .footer-text a:hover{ text-decoration: underline; }

  </style>
</head>
<body>

<div class="container">
  <!-- 1. Header Image -->
  <div class="header-container">
  <img src="./title.png" class="header-img" alt="Header">
  </div>
  <!-- 2. Canvas -->
  <div class="canvas-area">
    <div class="canvas-wrapper">
      <canvas id="twibbonCanvas"></canvas>
    </div>
  </div>

  <!-- 3. Action Controls -->
  <div class="controls">
    <div class="action-row">
      <button class="icon-btn" id="rotateLeftBtn">
        <svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 98.07 107.02"><defs><style>.cls-1 {fill: #f2f2f2;}</style></defs><g id="Layer_1-2" data-name="Layer 1"><path class="cls-1" d="m48.07,7.02c-9.8,0-19.4,2.91-27.52,8.27L15.18,0C13.13,12,6.44,27.2,0,38.17c12.04-4.11,28.28-7.62,40.44-7.23l-13.34-7.98c6.27-3.86,13.55-5.94,20.97-5.94,22.06,0,40,17.94,40,40s-17.94,40-40,40c-10.68,0-20.73-4.16-28.28-11.71-3.1-3.1-5.66-6.67-7.6-10.58l-8.96,4.43c2.42,4.9,5.61,9.34,9.49,13.22,9.44,9.44,22,14.64,35.35,14.64,27.57,0,50-22.43,50-50S75.64,7.02,48.07,7.02Z"/></g></svg>
      </button>


      <label class="icon-btn" style="position: relative; overflow: hidden;">
  <svg id="Layer_2" data-name="Layer 2" xmlns="http://w3.org" viewBox="0 0 114 84.5">
    <defs><style>.cls-1 { fill: #f2f2f2; }</style></defs>
    <g id="Layer_1-2" data-name="Layer 1">
      <g>
        <path class="cls-1" d="m57,24c-11.87,0-21.5,9.63-21.5,21.5s9.63,21.5,21.5,21.5,21.5-9.63,21.5-21.5-9.63-21.5-21.5-21.5Zm0,40.66c-10.58,0-19.16-8.58-19.16-19.16s8.58-19.16,19.16-19.16,19.16,8.58,19.16,19.16-8.58,19.16-19.16,19.16Z"/>
        <circle class="cls-1" cx="57" cy="45.5" r="6.08"/>
        <path class="cls-1" d="m102,6.5H33v-3.17c0-1.84-1.49-3.33-3.33-3.33h-8.34c-1.84,0-3.33,1.49-3.33,3.33v3.17h-6C5.4,6.5,0,11.9,0,18.5v54c0,6.6,5.4,12,12,12h90c6.6,0,12-5.4,12-12V18.5c0-6.6-5.4-12-12-12Zm-45,62c-12.7,0-23-10.3-23-23s10.3-23,23-23,23,10.3,23,23-10.3,23-23,23Zm43.5-43.5c-3.59,0-6.5-2.91-6.5-6.5s2.91-6.5,6.5-6.5,6.5,2.91,6.5,6.5-2.91,6.5-6.5,6.5Z"/>
      </g>
    </g>
  </svg>
  <input type="file" id="userPhoto" accept="image/*" 
         style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 10;">
</label>

      <button class="icon-btn" id="rotateRightBtn">
        <svg id="Layer_2" style="transform: scaleX(-1);" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 98.07 107.02"><defs><style>.cls-1 {fill: #f2f2f2;}</style></defs><g id="Layer_1-2" data-name="Layer 1"><path class="cls-1" d="m48.07,7.02c-9.8,0-19.4,2.91-27.52,8.27L15.18,0C13.13,12,6.44,27.2,0,38.17c12.04-4.11,28.28-7.62,40.44-7.23l-13.34-7.98c6.27-3.86,13.55-5.94,20.97-5.94,22.06,0,40,17.94,40,40s-17.94,40-40,40c-10.68,0-20.73-4.16-28.28-11.71-3.1-3.1-5.66-6.67-7.6-10.58l-8.96,4.43c2.42,4.9,5.61,9.34,9.49,13.22,9.44,9.44,22,14.64,35.35,14.64,27.57,0,50-22.43,50-50S75.64,7.02,48.07,7.02Z"/></g></svg>
      </button>
    </div>

    <!-- Scaler Button / Range -->
    <div class="slider-container">
      <input type="range" id="scaleSlider" min="0.1" max="2" step="0.01" value="1">
    </div>
  </div>

  <!-- 4. Download Button -->
<div class="footer-action">
    <button class="share-btn" id="shareBtn" disabled>
      <i class="fa-solid fa-share-nodes"></i> SHARE
    </button>
    <button class="download-btn" id="downloadBtn" disabled>
      <i class="fa-solid fa-download"></i> DOWNLOAD
    </button>
  </div>

<!--Footer - MPK Brandign -->
    <div class="footer">
  <div class="footer-img">
    <img src="https://mikthadpk.github.io/frame/avatar.jpg" alt="Developer">
  </div>
  <div class="footer-text">
    <div>Developed by: <b>Miqdad Sa-adi Al-Afzali</b></div>
    <div>
      To customize your form, please contact us at
      <a href="https://wa.me/918592957033" target="_blank">+91 85929 57033</a>

<div class="scroll-controls">
  <i class="fa-solid fa-angle-up" id="moveUpBtn"></i>
  <span>SCROLL</span>
  <i class="fa-solid fa-angle-down" id="moveDownBtn"></i>
</div>

</div>

<script>
  const canvas = document.getElementById('twibbonCanvas');
  const ctx = canvas.getContext('2d');
  
  const EXPORT_SIZE_Width = 935;
  const EXPORT_SIZE_Height = 1600;
  const DISPLAY_SIZE_Width = 250; 
  const DISPLAY_SIZE_Height = 428; 
  const SCALE_RATIO = EXPORT_SIZE_Width / DISPLAY_SIZE_Width;

  canvas.width = DISPLAY_SIZE_Width;
  canvas.height = DISPLAY_SIZE_Height;

  let userImg = new Image(), frameImg = new Image();
  let dragging = false, offsetX = 0, offsetY = 0;
  let pos = { x: -30, y: 100 }, scale = 1, rotation = 0;
  let userImgLoaded = false;

  // Load Frame
  frameImg.crossOrigin = "anonymous";
  frameImg.onload = () => draw();
  frameImg.src = './participant_frame.png';

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (userImgLoaded) {
      ctx.save();
      const w = userImg.width * scale;
      const h = userImg.height * scale;
      ctx.translate(pos.x + w/2, pos.y + h/2);
      ctx.rotate(rotation * Math.PI / 180); 
      ctx.drawImage(userImg, -w/2, -h/2, w, h);
      ctx.restore();
    }
    ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
  }

  // Handle Photo Upload & Auto-Center
  document.getElementById('userPhoto').addEventListener('change', (e) => {
    const reader = new FileReader();
    reader.onload = (f) => {
      userImg = new Image();
      userImg.onload = () => {
        userImgLoaded = true;
        scale = DISPLAY_SIZE_Width / userImg.width;
        
        // Auto-center the image horizontally and vertically
        pos.x = (canvas.width - (userImg.width * scale)) / 2;
        pos.y = (canvas.height - (userImg.height * scale)) / 2;
        
        document.getElementById('scaleSlider').value = scale;
        draw();
        document.getElementById('downloadBtn').disabled = false;
        document.getElementById('shareBtn').disabled = false;
      };
      userImg.src = f.target.result;
    };
    if(e.target.files[0]) {
      reader.readAsDataURL(e.target.files[0]);
    }
  });

  // Action Buttons & Slider
  document.getElementById('rotateLeftBtn').addEventListener('click', () => { rotation -= 90; draw(); });
  document.getElementById('rotateRightBtn').addEventListener('click', () => { rotation += 90; draw(); });
  document.getElementById('scaleSlider').addEventListener('input', (e) => { scale = parseFloat(e.target.value); draw(); });

  // Webpage Scroll Buttons
  document.getElementById('moveUpBtn').addEventListener('click', (e) => { 
    e.preventDefault();
    window.scrollBy({ top: -400, behavior: 'smooth' }); 
  });
  
  document.getElementById('moveDownBtn').addEventListener('click', (e) => { 
    e.preventDefault();
    window.scrollBy({ top: 400, behavior: 'smooth' });
  });

  // Mouse/Touch Dragging Logic
  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - r.left, y: cy - r.top };
  }

  canvas.addEventListener('mousedown', (e) => {
    if (!userImgLoaded) return;
    dragging = true;
    const m = getPos(e);
    offsetX = m.x - pos.x; 
    offsetY = m.y - pos.y;
  });

  canvas.addEventListener('touchstart', (e) => {
    if (!userImgLoaded) return;
    if (e.target === canvas) {
      e.preventDefault(); 
      dragging = true;
      const m = getPos(e.touches[0]); 
      offsetX = m.x - pos.x; 
      offsetY = m.y - pos.y;
    }
  }, { passive: false });

  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const m = getPos(e);
    pos.x = m.x - offsetX; 
    pos.y = m.y - offsetY;
    draw();
  });

  window.addEventListener('touchmove', (e) => {
    if (!dragging || !e.touches) return;
    e.preventDefault(); 
    const m = getPos(e.touches[0]);
    pos.x = m.x - offsetX; 
    pos.y = m.y - offsetY;
    draw();
  }, { passive: false });

  window.addEventListener('mouseup', () => dragging = false);
  window.addEventListener('touchend', () => dragging = false);

  // Mouse Wheel & Pinch Zoom
  canvas.addEventListener('wheel', (e) => {
    if (!userImgLoaded) return;
    e.preventDefault();
    const delta = e.deltaY < 0 ? 1.05 : 0.95;
    let newScale = scale * delta;
    if (newScale >= 0.1 && newScale <= 3) {
      scale = newScale;
      document.getElementById('scaleSlider').value = scale;
      draw();
    }
  }, { passive: false });

  canvas.addEventListener('dblclick', () => {
    if (!userImgLoaded) return;
    scale = DISPLAY_SIZE_Width / userImg.width; 
    document.getElementById('scaleSlider').value = scale;
    draw();
  });

  let initialPinchDist = null;
  function getPinchDist(e) {
    return Math.hypot(
      e.touches[0].pageX - e.touches[1].pageX,
      e.touches[0].pageY - e.touches[1].pageY
    );
  }

  canvas.addEventListener('touchstart', (e) => {
    if (!userImgLoaded) return;
    if (e.target === canvas) e.preventDefault(); 
    
    if (e.touches.length === 1) {
      dragging = true;
      const m = getPos(e.touches[0]);
      offsetX = m.x - pos.x;
      offsetY = m.y - pos.y;
    } else if (e.touches.length === 2) {
      dragging = false; 
      initialPinchDist = getPinchDist(e);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    if (!userImgLoaded) return;
    if (e.target === canvas) e.preventDefault();
    
    if (e.touches.length === 1 && dragging) {
      const m = getPos(e.touches[0]);
      pos.x = m.x - offsetX;
      pos.y = m.y - offsetY;
      draw();
    } else if (e.touches.length === 2 && initialPinchDist) {
      const currentDist = getPinchDist(e);
      const diff = currentDist / initialPinchDist;
      let newScale = scale * diff;

      if (newScale > 0.05 && newScale < 3) {
        scale = newScale;
        document.getElementById('scaleSlider').value = scale;
        draw();
      }
      initialPinchDist = currentDist; 
    }
  }, { passive: false });

  // Download Output
  document.getElementById('downloadBtn').addEventListener('click', () => {
    const out = document.createElement('canvas');
    out.width = EXPORT_SIZE_Width; 
    out.height = EXPORT_SIZE_Height;
    const octx = out.getContext('2d');
    
    const w = (userImg.width * scale) * SCALE_RATIO;
    const h = (userImg.height * scale) * SCALE_RATIO;
    octx.save();
    octx.translate((pos.x * SCALE_RATIO) + w/2, (pos.y * SCALE_RATIO) + h/2);
    octx.rotate(rotation * Math.PI / 180);
    octx.drawImage(userImg, -w/2, -h/2, w, h);
    octx.restore();
    
    octx.drawImage(frameImg, 0, 0, EXPORT_SIZE_Width, EXPORT_SIZE_Height);

    const a = document.createElement('a');
    a.download = 'Jalaliyya_Meelad.png';
    a.href = out.toDataURL('image/png', 1.0);
    a.click();
  });

  // Share Output
  document.getElementById('shareBtn').addEventListener('click', async () => {
    // 1. Generate the final canvas (same process as downloading)
    const out = document.createElement('canvas');
    out.width = EXPORT_SIZE_Width; 
    out.height = EXPORT_SIZE_Height;
    const octx = out.getContext('2d');
    
    const w = (userImg.width * scale) * SCALE_RATIO;
    const h = (userImg.height * scale) * SCALE_RATIO;
    octx.save();
    octx.translate((pos.x * SCALE_RATIO) + w/2, (pos.y * SCALE_RATIO) + h/2);
    octx.rotate(rotation * Math.PI / 180);
    octx.drawImage(userImg, -w/2, -h/2, w, h);
    octx.restore();
    octx.drawImage(frameImg, 0, 0, EXPORT_SIZE_Width, EXPORT_SIZE_Height);

    // 2. Convert canvas to a File and use the Web Share API
    out.toBlob(async (blob) => {
      if (!blob) return;
      
      const file = new File([blob], 'Jalaliyya_Meelad.png', { type: 'image/png' });
      
      // Setup the text, title, and link for sharing
      const shareData = {
        title: 'Jalaliyya Meelad 2026',
        text: 'Join me in celebrating Jalaliyya Meelad! Create your personalized photo frame here:',
        url: 'https://mpk.work.gd/application/twibbon/jalaliyya_meelad/',
        files: [file]
      };

      // 3. Check if the device supports sharing files
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share(shareData);
        } catch (err) {
          // Users might cancel the share sheet, so we silently catch the error
          console.log('Share canceled or failed:', err);
        }
      } else {
        // Fallback for older browsers (like Desktop Chrome sometimes)
        alert("Your browser doesn't support direct image sharing. Please click Download and share it manually!");
      }
    }, 'image/png');
  });
</script>
</body>
